name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Patch Buildozer to skip root check
      run: |
        sed -i 's/def check_root/def check_root_disabled/g' /home/user/.venv/lib/python3.12/site-packages/buildozer/__init__.py
    
    - name: Build APK with Buildozer
      run: |
        cd /home/user/hostcwd
        echo "y" | buildozer android debug
      env:
        BUILDOZER_LOG_LEVEL: 2
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Check build results
      if: always()
      run: |
        echo "=== Build directory ==="
        ls -lah /home/user/hostcwd/bin/ 2>/dev/null || echo "No bin directory"
        echo ""
        echo "=== All APK files ==="
        find /home/user/hostcwd -name "*.apk" 2>/dev/null || echo "No APK found"
