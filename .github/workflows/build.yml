name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user 1000
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Fix permissions
      run: |
        sudo chown -R user:user /home/user/hostcwd
        sudo chown -R user:user /home/user/.buildozer
    
    - name: Build APK with Buildozer
      run: |
        cd /home/user/hostcwd
        buildozer android debug
      env:
        BUILDOZER_LOG_LEVEL: 2
      timeout-minutes: 120
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Check build results
      if: always()
      run: |
        echo "=== Build directory ==="
        ls -lah /home/user/hostcwd/bin/ 2>/dev/null || echo "No APK built"
        echo ""
        find /home/user/hostcwd -name "*.apk" 2>/dev/null
