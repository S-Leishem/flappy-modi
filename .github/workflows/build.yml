name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git cython3 libffi-dev libssl-dev \
          libjpeg-dev zlib1g-dev autoconf libtool pkg-config ccache
    
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Build APK with auto-accept licenses
      run: |
        buildozer android debug -- --accept-sdk-license
      timeout-minutes: 180
      env:
        BUILDOZER_ACCEPT_SDK_LICENSE: "yes"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Check results
      if: always()
      run: |
        echo "=== Build Results ==="
        ls -lh bin/*.apk 2>/dev/null && echo "✅ APK built!" || echo "❌ Build failed"
        tail -100 .buildozer/android/platform/build-*_armeabi-v7a/build/outputs/buildozer.log 2>/dev/null || echo "Log not found"
