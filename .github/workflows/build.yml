name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Buildozer
      run: |
        cd /home/user/hostcwd
        buildozer android debug -- --accept-sdk-license
      env:
        BUILDOZER_LOG_LEVEL: 2
        BUILDOZER_ACCEPT_SDK_LICENSE: 'yes'
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Check build results
      if: always()
      run: |
        echo "=== Build results ==="
        ls -lah /home/user/hostcwd/bin/ 2>/dev/null || echo "No APK found"
        find /home/user/hostcwd -name "*.apk" -o -name "*.log" 2>/dev/null
