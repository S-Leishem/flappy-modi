name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git cython3 libffi-dev libssl-dev \
          libjpeg-dev zlib1g-dev autoconf libtool pkg-config ccache
    
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        echo "count=0" > ~/.android/repositories.cfg
        
        # Create licenses directory
        mkdir -p $HOME/.android/licenses
        
        # Accept all SDK licenses
        for license in android-sdk-license android-sdk-preview-license android-googletv-license google-gms-license-agreement moto-x-preview-license
        do
          echo -e "\n\n\n\n\n\n\n\n\nyes" | sdkmanager --licenses >/dev/null 2>&1 || true
        done
        
        # Accept licenses by writing them directly
        echo "8403ad9ac89b7c51" > $HOME/.android/licenses/android-sdk-license
        echo "33b6a2b64607f11c" > $HOME/.android/licenses/google-gms-license-agreement
        echo "" > $HOME/.android/licenses/moto-x-preview-license
    
    - name: Build APK
      run: |
        buildozer android debug
      timeout-minutes: 180
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Check results
      if: always()
      run: |
        echo "=== Build Results ==="
        if [ -f bin/*.apk ]; then
          ls -lh bin/*.apk
          echo "✅ APK successfully built!"
        else
          echo "❌ APK build failed"
          echo ""
          echo "=== Build Error Log ==="
          find .buildozer -name "*.log" -exec tail -50 {} \; 2>/dev/null
        fi
