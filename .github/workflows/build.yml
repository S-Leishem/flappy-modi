name: Build Flappy Modi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          cython3 \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          autoconf \
          libtool \
          pkg-config \
          ccache \
          openjdk-11-jdk-headless
    
    - name: Install Android SDK
      run: |
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        export PATH=~/android-sdk/cmdline-tools/latest/bin:$PATH
        export ANDROID_SDK_ROOT=~/android-sdk
        
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653" 2>&1 | grep -E "(Installing|Installed)"
    
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_HOME=~/android-sdk
        export PATH=~/android-sdk/cmdline-tools/latest/bin:$PATH
        
        buildozer android debug 2>&1 | tail -100
      timeout-minutes: 180
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: flappy-modi-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Show build status
      if: always()
      run: |
        echo "=== APK Build Status ==="
        if [ -f bin/*.apk ]; then
          ls -lh bin/*.apk
          echo "✅ APK built successfully!"
        else
          echo "❌ APK build failed"
          echo "=== Build log (last 50 lines) ==="
          find . -name "buildozer.log" -exec tail -50 {} \;
        fi
